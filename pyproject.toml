[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeaugment"
version = "0.2.0"
description = "Resume text/layout augmentation pipeline for resume-parsing model robustness"
requires-python = ">=3.9"
dependencies = [
    "spacy>=3.7",
    "nlpaug>=1.1.11",
    "nltk>=3.8",
    "pandas>=2.0",
    "streamlit>=1.30.0"
]

[tool.setuptools.packages.find]
where = ["src"]
